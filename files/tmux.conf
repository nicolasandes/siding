# tmux — layout automation for the myworkspace worktree-per-task workflow.
# Runs inside Ghostty. Ghostty gives you GUI tabs and windows; tmux gives you
# scripted per-task pane layouts and detach/reattach, which a GUI cannot.
#
# Prefix is Ctrl-a (Ctrl-b is Rails/readline "back one char" and you will be
# typing in a rails console in one of these panes all day).

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse: click to focus a pane, drag borders to resize, scroll to scrollback.
# This is what makes it feel like a GUI split rather than a keyboard puzzle.
set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"
set -g history-limit 50000
set -sg escape-time 10          # 500ms default makes vim/readline feel laggy
set -g focus-events on
set -g base-index 1             # windows/panes count from 1, matching the keys
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
# Window/tab title: the window name only. #S here was the session name, which
# rendered as "alex — home" and reads like the alex repository.
set -g set-titles-string "#W"

# Splits that read like what they do, opening in the current pane's directory
# (so a split from a worktree pane lands in that worktree, not $HOME).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation without the prefix — Alt+arrow.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind z resize-pane -Z            # zoom a pane fullscreen and back

# ── The workspace ────────────────────────────────────────────────────────────
# Option+r  → pick a repo (or a task worktree); opens a window with Claude on
#             the left and a shell on the right, both already in that tree.
# Option+x  → close the current repo window (asks first).
# The window list in the status bar is your tab strip: click a name to switch.
#
# Option, not the Ctrl-a prefix: Ctrl-a never arrives on this machine — nothing
# remaps it (hidutil reports no UserKeyMapping, Ghostty has no keybind
# overrides), but pressing it does nothing while M-r fires immediately. The
# prefix bindings stay below in case that is ever resolved.
# display-popup -E, not display-menu. A menu is an overlay: with no attached
# client or a bad target it draws nowhere and the key looks dead, which is
# exactly what happened. A popup runs a real program on a real TTY, so its
# output — including any error — lands somewhere you can read it.
bind r display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
# Prefix-free routes to the same picker, because a prefix key that some other
# layer swallows leaves you with no way in at all. F1 is rarely intercepted.
bind -n M-r display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
bind -n F1  display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
# ⌥p — switch workspace/identity. ⌥s is tmux's own session tree; this one knows
# about profiles and switches the gh account with them.
bind -n M-p display-popup -E -w 60% -h 50% "$HOME/.siding-profilepick.zsh"
# Mouse route to the picker: DOUBLE-CLICK the status bar.
#
# Deliberately not right-click. tmux's built-in right-click menus are worth
# keeping — right-click a window tab for Kill / Rename / Respawn / Swap / New,
# right-click the left badge for the session menu. Overriding MouseDown3Status
# took those away; double-click is free and collides with nothing.
bind -n DoubleClick1Status        display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
bind -n DoubleClick1StatusDefault display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
bind -n DoubleClick1StatusLeft    display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
bind -n DoubleClick1StatusRight   display-popup -E -w 60% -h 70% "$HOME/.siding-pick.zsh"
bind x kill-window
# Option+x closes the current repo window. Confirmed first: it is an easy key to
# hit by accident and the window usually has a Claude session running in it.
bind -n M-x confirm-before -p "close #W? (y/n) " kill-window
bind -n M-d detach-client
# Session switcher: the workspace is one session; personal projects can live in
# their own. Zoomed tree of sessions and windows.
bind -n M-s choose-tree -Zs
bind -n M-Tab next-window

# Splits on Option, inheriting the CURRENT PANE's directory. Without -c,
# split-window uses the session's working directory — the workspace root — so a
# split from the repo pane landed in myworkspace instead of the repo.
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M--   split-window -v -c "#{pane_current_path}"
bind -n M-w   kill-pane
# NOTE: no `mouse-select-window` here — it was removed in tmux 2.1 and the
# error aborts the rest of this file. `set -g mouse on` above already covers
# clicking window names in the status bar.

# Copy mode with vi keys; y copies to the macOS clipboard.
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Status bar: session name is the task, so you always know which worktree the
# panes around you are pointed at.
set -g status-position bottom
set -g status-style "bg=default,fg=white"
# The window name — which is the repo, or repo~task for a worktree. Pinned to
# the window rather than derived from the focused pane's path: the Claude pane
# sits at the workspace root while the shell sits in the repo, so a path-derived
# badge flipped between "myworkspace" and the repo as you moved between panes.
# Not the session name either; that was the constant "alex".
set -g status-left "#[bg=green,fg=black,bold] #W #[default] "
set -g status-left-length 60
set -g status-interval 5
# The GitHub account this session acts as, set by `siding ws`. On screen at
# all times because acting as the wrong account is silent until a push fails.
set -g status-right "#[fg=green,bold]#{@gh}#[fg=brightblack]  ·  #[fg=white]%H:%M "
set -g status-right-length 40

# A second status line for the shortcuts. tmux cannot render a smaller font —
# it is a character grid, one cell size for everything — so the way to stop the
# hints crowding the window list is to give them their own row and dim them.
set -g status 2
set -g status-format[1] "#[align=centre,bg=default,fg=brightblack]#[fg=green,bold]⌥r#[fg=brightblack,nobold] repos  #[fg=green,bold]⌥\\#[fg=brightblack,nobold] split →  #[fg=green,bold]⌥-#[fg=brightblack,nobold] split ↓  #[fg=green,bold]⌥w#[fg=brightblack,nobold] ✕pane  #[fg=green,bold]⌥x#[fg=brightblack,nobold] ✕tab  #[fg=green,bold]⌥p#[fg=brightblack,nobold] workspace  #[fg=green,bold]⌥⇥#[fg=brightblack,nobold] next  #[fg=green,bold]⌥d#[fg=brightblack,nobold] detach"
setw -g window-status-current-style "fg=green,bold"
# ● marks a window whose agent has gone quiet — see siding-open.zsh.
setw -g window-status-format " #I:#W#{?window_silence_flag,#[fg=yellow]●#[default],} "
setw -g window-status-current-format " #I:#W "
# The flag alone; no popup message every time a pane pauses.
set -g silence-action none
set -g visual-silence off
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set -g message-style "bg=green,fg=black"
